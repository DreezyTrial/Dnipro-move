<section id="calculator" class="wrap">
  <div class="head">
    <h2>Прорахувати вартість перевезення</h2>
    <p>Адреси й що веземо — сума зʼявиться нижче. Це ціна перевезення, без прихованих платежів.</p>
  </div>

  <div #slot id="calculator-iframe" class="slot" [class.live]="!!iframeSrc">
    @if (iframeSrc) {
      <iframe
        #frame
        title="Калькулятор вартості перевезення"
        [src]="iframeSrc"
        scrolling="no"
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade"
        (load)="onIframeLoad()"
      ></iframe>
    } @else {
      <div class="placeholder">
        <strong>Калькулятор ще не підключений</strong>
        <p>Вкажіть адресу у <code>environment.calculatorIframeUrl</code></p>
      </div>
    }
  </div>
</section>
