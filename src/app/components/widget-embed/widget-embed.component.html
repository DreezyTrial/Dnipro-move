<section id="calculator" class="wrap">
  <h2 class="sr-only">Калькулятор вартості</h2>

  <div id="calculator-iframe" class="slot" [class.live]="!!iframeSrc">
    @if (iframeSrc) {
      <iframe
        title="Калькулятор вартості перевезення"
        [src]="iframeSrc"
        loading="eager"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>
    } @else {
      <div class="placeholder">
        <strong>Калькулятор вартості</strong>
        <p>Вкажіть URL у <code>environment.calculatorIframeUrl</code></p>
      </div>
    }
  </div>
</section>
